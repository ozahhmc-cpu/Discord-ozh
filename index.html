<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز التحديثات والفعاليات - Ozh Mc</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background-color: #0f1117;
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
}

/* شريط الـ LIVE العلوي /
.live-banner {
width: 100%;
background: linear-gradient(90deg, #ff0055, #ff5500);
color: white;
text-align: center;
padding: 12px;
font-weight: bold;
font-size: 1.1rem;
display: none; / يظهر فقط عند وجود بث أو حدث */
box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
animation: pulse 2s infinite;
}

@keyframes pulse {
0% { opacity: 0.9; }
50% { opacity: 1; }
100% { opacity: 0.9; }
}

.dot {
height: 10px;
width: 10px;
background-color: #fff;
border-radius: 50%;
display: inline-block;
margin-left: 8px;
}

/* الحاوية الرئيسية */
.container {
max-width: 800px;
width: 90%;
margin-top: 40px;
text-align: center;
}

.card {
background-color: #1a1d26;
border-radius: 12px;
padding: 25px;
margin-bottom: 25px;
border: 1px solid #2d3243;
box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

h1 { margin-bottom: 10px; color: #5865F2; }
p { color: #a3a8b7; line-height: 1.6; }

.stats {
display: flex;
justify-content: center;
gap: 20px;
margin-top: 15px;
}

.stat-badge {
background: #232733;
padding: 8px 16px;
border-radius: 20px;
font-size: 0.9rem;
color: #43b581;
}

/* زر الانضمام */
.btn-discord {
display: inline-block;
background-color: #5865F2;
color: white;
padding: 12px 30px;
border-radius: 8px;
text-decoration: none;
font-weight: bold;
margin-top: 15px;
transition: 0.3s;
}

.btn-discord:hover {
background-color: #4752C4;
transform: translateY(-2px);
}
</style>
</head>
<body>

<!-- شريط البث/الأحداث المباشرة -->
<div id="liveBanner" class="live-banner">
<span class="dot"></span> <span id="eventTitle">مباشر الآن: هناك حدث شغال في السيرفر!</span>
</div>

<div class="container">
<!-- معلومات السيرفر -->
<div class="card">
<h1 id="serverName">جاري تحميل بيانات السيرفر...</h1>
<p>أهلاً بك! تابع كافة الأحداث والتحديثات المباشرة الخاصة بالسيرفر هنا.</p>

<div class="stats">
<span class="stat-badge">🟢 المتواجدون الآن: <strong id="onlineCount">0</strong></span>
</div>

<a id="joinBtn" href="#" target="_blank" class="btn-discord">دخول السيرفر</a>
</div>

<!-- قسم التحديثات -->
<div class="card" style="text-align: right;">
<h2>📢 التحديثات والأخبار</h2>
<hr style="border-color: #2d3243; margin: 15px 0;">
<div id="updatesList">
<p>💡 يتم تحديث هذه الصفحة تلقائياً لمتابعة حالة السيرفر والأحداث المباشرة.</p>
</div>
</div>
</div>

<script>
const SERVER_ID = "1528910750238638180";

async function fetchDiscordData() {
try {
// جلب بيانات السيرفر مباشرة من Discord Widget API
const response = await fetch(https://discord.com/api/guilds/${SERVER_ID}/widget.json);

if (!response.ok) {
throw new Error("تأكد من تفعيل ميزة Enable Server Widget في إعدادات السيرفر");
}

const data = await response.json();

// تحديث اسم السيرفر والأعضاء والرابط
document.getElementById('serverName').innerText = data.name;
document.getElementById('onlineCount').innerText = data.presence_count;
document.getElementById('joinBtn').href = data.instant_invite || "#";

} catch (error) {
console.error("خطأ في جلب البيانات:", error);
document.getElementById('serverName').innerText = "سيرفر الديسكورد";
}
}

// تشغيل جلب البيانات عند فتح الصفحة
fetchDiscordData();

// إعادة فحص التحديثات كل 30 ثانية أوتوماتيكياً
setInterval(fetchDiscordData, 30000);
</script>
</body>
</html>
